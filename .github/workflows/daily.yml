name: Daily Link
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post random link
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        URL=$(shuf -n 1 links.txt)
        curl -H "Content-Type: application/json" \
            -d "{\"content\": \"$URL\"}" \
            "$DISCORD_WEBHOOK"
