name: Post Daily Random Link
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  post-daily-random-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
      - uses: actions/checkout@v6
      - name: Curl webhook url with random link as content
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          URL=$(shuf -n 1 links.txt)
          curl -H "Content-Type: application/json" \
              -d "{\"content\": \"$URL\"}" \
              "$DISCORD_WEBHOOK"
